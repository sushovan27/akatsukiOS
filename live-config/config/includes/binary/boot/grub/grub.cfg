# Akatsuki Linux Live GRUB Configuration
set default="0"
set timeout=15

if loadfont ${prefix}/fonts/unicode.pf2; then
    set gfxmode=1920x1080,1600x900,1366x768,1280x720,1024x768,auto
    loadfont ${prefix}/fonts/unicode.pf2
    set gfxpayload=keep
    terminal_output gfxterm
    insmod gfxterm
    insmod gfxmenu
    insmod jpeg
    insmod png
fi

# Try to load custom theme
if [ -f /boot/grub/themes/akatsuki/theme.txt ]; then
    set theme=/boot/grub/themes/akatsuki/theme.txt
    set color_normal=white/black
    set color_highlight=#c792ea/black
fi

# Color scheme fallback
if [ -z "$theme" ]; then
    set menu_color_normal=cyan/blue
    set menu_color_highlight=white/blue
fi

# Akatsuki Linux Live entry
menuentry "Akatsuki Linux Live" {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components splash quiet loglevel=3
    initrd /live/initrd.img
}

menuentry "Akatsuki Linux Live (Safe Graphics)" {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components splash quiet loglevel=3 nomodeset nouveau.modeset=0
    initrd /live/initrd.img
}

menuentry "Akatsuki Linux Live (Text Mode)" {
    linux /live/vmlinuz boot=live components quiet loglevel=3 nomodeset console=ttyS0,115200
    initrd /live/initrd.img
}

menuentry "Boot from first hard disk" {
    insmod chain
    set root=(hd0)
    chainloader +1
}

menuentry "System Information" {
    echo "Akatsuki Linux Live - System Information"
    echo "----------------------------------------"
    ls
    echo "Press any key to return..."
    read
}

# Advanced options submenu
submenu "Advanced options" {
    menuentry "Memory test (memtest86+)" {
        linux /live/memtest86+.bin
    }
    menuentry "Boot with verbose output" {
        set gfxpayload=keep
        linux /live/vmlinuz boot=live components splash=off verbose loglevel=7
        initrd /live/initrd.img
    }
}
