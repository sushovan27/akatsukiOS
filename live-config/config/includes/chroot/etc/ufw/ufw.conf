# Akatsuki Linux UFW Configuration
# Enable firewall on boot
ENABLED=yes

# Default policies
# Deny all incoming, allow all outgoing
DEFAULT_INPUT_POLICY="DROP"
DEFAULT_OUTPUT_POLICY="ACCEPT"
DEFAULT_FORWARD_POLICY="DROP"

# Application profile auto-applying
APPLY_RULES=yes

# Logging
LOG_ENABLED=yes
LOG_LEVEL=low

# Manage /etc/ufw/before.rules, /etc/ufw/after.rules
# Manage /etc/ufw/user.rules, /etc/ufw/user6.rules
