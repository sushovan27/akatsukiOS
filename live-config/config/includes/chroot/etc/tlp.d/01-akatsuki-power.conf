# Akatsuki Linux TLP Power Profile Configuration

# CPU Frequency Scaling
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_MIN_FREQ_ON_AC=0
CPU_SCALING_MAX_FREQ_ON_AC=0
CPU_SCALING_MIN_FREQ_ON_BAT=0
CPU_SCALING_MAX_FREQ_ON_BAT=0
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_HWP_ON_AC=balance_performance
CPU_HWP_ON_BAT=balance_power

# Intel P-State
CPU_DRIVER_SPECIFIC_ON_AC=performance
CPU_DRIVER_SPECIFIC_ON_BAT=power

# GPU Power Management
GPU_POWER_PROFILE_ON_AC=high
GPU_POWER_PROFILE_ON_BAT=low

# PCI Express Active State Power Management
PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=powersupersave

# SATA Link Power Management
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=min_power

# WiFi Power Saving
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
WIFI_SAVE_UP_DEVS=0

# Bluetooth
BAY_POWEROFF_ON_BAT=1
BAY_POWEROFF_AC=0

# Runtime Power Management
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_ALL=1
RUNTIME_PM_DRIVER_BLACKLIST="mei_me nouveau nvidia"

# USB Autosuspend
USB_AUTOSUSPEND=1
USB_BLACKLIST_BTUSB=0
USB_BLACKLIST_PHONE=0
USB_BLACKLIST_PRINTER=0
USB_BLACKLIST_WWAN=0
USB_ALLOWLIST="046d:c534 046d:c52b 046d:c539"
USB_AUTOSUSPEND_DISABLE_ON_SHUTDOWN=1

# Audio Power Saving
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# Disk
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"
DISK_SPINDOWN_TIMEOUT_ON_AC="0 0"
DISK_SPINDOWN_TIMEOUT_ON_BAT="0 0"
DISK_IOSCHED="mq-deadline"

# Network
NET_WIFI_TIMEOUT=15
NET_WWAN_TIMEOUT=30

# Virtual Memory
VM_DONT_POLL_FILE_ON_AC=false
VM_DONT_POLL_FILE_ON_BAT=true
