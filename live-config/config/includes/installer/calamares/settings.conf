# Akatsuki Linux Calamares Installer Settings
---
modules-search:
    - share/calamares/modules
    - /usr/lib/x86_64-linux-gnu/calamares/modules

sequence:
    - show:
        - welcome
        - license
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - networkcfg
        - users
        - displaymanager
        - grubcfg
        - bootloader
        - packages
        - services-systemd
        - chrootcfg
        - umount
    - show:
        - finished

branding:
    name: "Akatsuki Linux"
    version: "1.0"
    short-name: "Akatsuki"
    short-version: "1.0"
    product-name: "Akatsuki Linux 1.0"
    product-url: "https://akatsukilinux.org"
    support-url: "https://akatsukilinux.org/support"
    known-issues-url: "https://akatsukilinux.org/issues"
    release-notes-url: "https://akatsukilinux.org/release-notes"
    donate-url: "https://akatsukilinux.org/donate"
    logo: "/usr/share/calamares/branding/akatsuki/logo.png"
    welcome: "Welcome to the Akatsuki Linux installer."
    welcome-style: "sidebar"

presets:
    welcome:
        show-support-url: true
        show-donate-link: false
        show-known-issues: true
        show-release-notes: true
    partition:
        defaultFilesystemType: "ext4"
        drawNestedPartitions: true
        enableEncryptWidget: true
        enableLuksAutoPart: true
        initialPartitioningChoice: "erase"
    users:
        autologin: true
        defaultGroups: ["sudo", "adm", "lp", "cdrom", "floppy", "audio", "dip", "video", "plugdev", "netdev", "bluetooth", "wireshark", "scanner", "vboxsf", "docker", "libvirt"]
        permitRootLogin: false
        setRootPassword: false
    displaymanager:
        basicSetup: true
        desktopFile: "gnome"
        displayManagers:
            - gdm
        defaultDesktop: "gnome"
    bootloader:
        efi: true
        bios: true
        grubInstallBios: true
        grubInstallEfi: true
    packages:
        operations:
            - install:
                - ~akatsuki-security
                - ~akatsuki-ai
                - ~nvidia-driver
                - ~nvidia-cuda-toolkit
            - try_install:
                - ~akatsuki-academic
