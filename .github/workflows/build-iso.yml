name: Akatsuki Linux Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-packages:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          reprepro dpkg-dev devscripts lintian \
          debhelper build-essential
          
    - name: Build Debian Packages
      run: |
        mkdir -p build/debs build/apt-repo
        for pkg_dir in packages/*/; do
          if [ -d "$pkg_dir/debian" ]; then
            pkg_name=$(basename "$pkg_dir")
            echo "Building package: $pkg_name"
            cd "$pkg_dir"
            dpkg-buildpackage -us -uc -b
            cd ../../
          fi
        done
        find . -maxdepth 2 -name "*.deb" -exec cp {} build/debs/ \;

    - name: Setup Local APT Repository
      run: |
        if command -v reprepro &>/dev/null; then
          mkdir -p build/apt-repo/conf
          cat > build/apt-repo/conf/distributions << 'DISTRIB'
        Origin: Akatsuki Linux
        Label: Akatsuki Linux
        Suite: trixie
        Codename: trixie
        Architectures: amd64 source
        Components: main
        Description: Akatsuki Linux APT Repository
        DISTRIB
          for deb in build/debs/*.deb; do
            reprepro -b build/apt-repo includedeb trixie "$deb"
          done
        fi

    - name: Upload Built Packages
      uses: actions/upload-artifact@v4
      with:
        name: akatsuki-debs
        path: |
          build/debs/*.deb
          build/apt-repo/
        retention-days: 7

  build-iso:
    runs-on: ubuntu-latest
    needs: build-packages
    container:
      image: debian:trixie
      options: --privileged

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          live-build debootstrap ca-certificates \
          git rsync wget curl

    - name: Download Built Packages
      uses: actions/download-artifact@v4
      with:
        name: akatsuki-debs
        path: build/

    - name: Build Live ISO
      run: |
        mkdir -p build/iso
        cd live-config

        # Ensure live-build auto scripts are executable
        if [ -d auto ]; then
          find auto -type f -exec chmod +x {} \;
        fi
        test -x auto/build || { echo "FATAL: auto/build must be executable"; ls -la auto/; exit 1; }

        # Copy local packages to chroot include
        if [ -d "../build/debs" ]; then
          mkdir -p config/packages.chroot
          find "../build/debs" -name "*.deb" -exec cp {} config/packages.chroot/ \;
        fi
        
        lb config --distribution trixie --binary-images iso-hybrid \
          --archive-areas "main contrib non-free non-free-firmware" \
          --architectures amd64 \
          --linux-flavours amd64 \
          --bootappend-live "boot=live components splash quiet loglevel=3" \
          --debian-installer live \
          --debian-installer-gui true \
          --iso-application "Akatsuki Linux 1.0" \
          --iso-preparer "Akatsuki Linux Team" \
          --iso-publisher "Akatsuki Linux" \
          --iso-volume "Akatsuki-Linux-1.0" \
          --firmware-binary true \
          --firmware-chroot true \
          --memtest none \
          --apt-recommends false \
          --updates true \
          --security true \
          --backports true \
          --cache-packages true
          
        lb build 2>&1 | tee build.log
        
        iso_file=$(ls -1 *.iso 2>/dev/null | head -1)
        if [ -n "$iso_file" ]; then
          cp "$iso_file" "../build/iso/"
          echo "ISO built: $iso_file"
          echo "SHA256: $(sha256sum "$iso_file" | cut -d' ' -f1)"
        else
          echo "ERROR: ISO file not generated"
          grep -nE "E: |Err:|ERROR|failed" build.log | tail -200 || true
          tail -300 build.log
          exit 1
        fi
        rm -rf config/packages.chroot

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Akatsuki-Linux-ISO
        path: build/iso/*.iso
        retention-days: 7
